name: COOLTONE Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: cooltone-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCOOLTONE_BUILD_PLUGIN=ON -DCOOLTONE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/VST3,dist/Standalone | Out-Null
          $v=Get-ChildItem build -Recurse -Directory -Filter COOLTONE.vst3 | Select-Object -First 1
          if(-not $v){throw "VST3 bundle missing"}
          Copy-Item $v.FullName dist/VST3/COOLTONE.vst3 -Recurse -Force
          $e=Get-ChildItem build -Recurse -File -Filter COOLTONE.exe | Select-Object -First 1
          if(-not $e){throw "Standalone executable missing"}
          Copy-Item $e.FullName dist/Standalone/COOLTONE.exe -Force
          Copy-Item README.md dist/README.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create installer
        shell: pwsh
        run: |
          $iscc="$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if(-not(Test-Path $iscc)){$iscc="$env:ProgramFiles\Inno Setup 6\ISCC.exe"}
          if(-not(Test-Path $iscc)){throw "ISCC.exe missing"}
          & $iscc installer/COOLTONE.iss
          if($LASTEXITCODE -ne 0){throw "Installer compilation failed"}
      - name: Create ZIP
        shell: pwsh
        run: |
          Copy-Item installer/Output/COOLTONE-Setup.exe dist/COOLTONE-Setup.exe
          Compress-Archive -Path dist/* -DestinationPath COOLTONE-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: COOLTONE-Windows-x64
          path: COOLTONE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
